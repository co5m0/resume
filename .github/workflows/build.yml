name: Build Resume

on:
  pull_request:
    # shortcut: filtered required checks can stay pending; use job-level filtering if this workflow becomes required.
    paths:
      - resume.json
      - resume.tmpl.tex
      - generate.sh
      - flake.nix
      - flake.lock
      - '.github/workflows/**'
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build and check PDF
        run: |
          nix build --print-build-logs
          nix flake check --print-build-logs

      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: result/resume.pdf
